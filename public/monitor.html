<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Campaign — Kit AB Tester</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="topbar">
    <h1>Kit Email AB Tester</h1>
    <nav>
      <a href="/">← New campaign</a>
    </nav>
  </div>

  <div class="shell">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h2 id="name">Loading…</h2>
          <p class="muted small" id="meta"></p>
        </div>
        <div id="status_pill"></div>
      </div>

      <h3>Current winning subject</h3>
      <p style="font-size:18px; font-weight:600; margin:0 0 8px;" id="winner">—</p>

      <h3>Progress</h3>
      <p id="progress" class="small muted">—</p>

      <div class="actions">
        <button class="btn-ghost" id="pause_btn" style="display:none;">Pause</button>
        <button id="resume_btn" style="display:none;">Resume</button>
        <button id="retry_btn" style="display:none;">Retry</button>
        <a href="/" class="btn btn-ghost">← Back to dashboard</a>
      </div>
      <p class="small" id="error_text" style="color: var(--bad); display:none;"></p>
    </div>

    <div class="card">
      <h2>Round history</h2>
      <div id="rounds"></div>
    </div>
  </div>

  <script>
    const id = location.pathname.split('/').pop();
    let timer;

    function pct(x) { return (Math.round((x || 0) * 10) / 10) + '%'; }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    }

    async function refresh() {
      const r = await fetch(`/api/campaigns/${id}`);
      if (!r.ok) return;
      const { campaign, rounds } = await r.json();

      const isTournament = campaign.campaign_type === 'tournament';
      const modeBadge = isTournament ? ' · tournament bracket' : ' · sequential';

      document.getElementById('name').textContent = campaign.name;
      document.getElementById('meta').textContent =
        `${campaign.audience_type}: ${campaign.audience_label || campaign.audience_id} · batch ${campaign.batch_size} · ${Math.round(campaign.wait_seconds/60)}min wait between rounds${modeBadge}`;
      document.getElementById('winner').textContent = campaign.current_winner;
      document.getElementById('status_pill').innerHTML = `<span class="pill ${campaign.status}">${campaign.status}</span>`;

      // Friendlier progress label for tournament
      const stageLabel = (n) => {
        if (!isTournament) return `Round ${n}`;
        return n === 1 ? 'Semifinals' : n === 2 ? 'Final' : n === 3 ? 'Title match' : `Round ${n}`;
      };
      const total = isTournament ? 3 : (campaign.total_rounds || '?');
      document.getElementById('progress').textContent =
        `${stageLabel(campaign.current_round || 0)} of ${total}` +
        (campaign.next_action ? `   ·   next: ${campaign.next_action}${campaign.next_run_at ? ' at ' + new Date(campaign.next_run_at).toLocaleTimeString() : ''}` : '');

      document.getElementById('pause_btn').style.display = campaign.status === 'running' ? '' : 'none';
      document.getElementById('resume_btn').style.display = campaign.status === 'paused' ? '' : 'none';
      document.getElementById('retry_btn').style.display = campaign.status === 'error' ? '' : 'none';

      const err = document.getElementById('error_text');
      if (campaign.last_error) {
        err.style.display = 'block';
        err.textContent = `Last error: ${campaign.last_error}`;
      } else {
        err.style.display = 'none';
      }

      // Group rounds by round_number so tournament R1 (multiple matches) renders together.
      const byRound = new Map();
      for (const m of rounds) {
        if (!byRound.has(m.round_number)) byRound.set(m.round_number, []);
        byRound.get(m.round_number).push(m);
      }
      const roundNumbers = [...byRound.keys()].sort((a, b) => b - a); // newest first

      function tournamentLabel(m) {
        const mn = m.match_number || 1;
        if (m.round_number === 1) return mn === 1 ? 'Semifinal 1 — S1 vs S2' : 'Semifinal 2 — S3 vs S4';
        if (m.round_number === 2) return 'Final — winners of SF1 vs SF2';
        if (m.round_number === 3) return 'Title match — vs S5';
        return `Round ${m.round_number} · Match ${mn}`;
      }

      function renderMatch(m, matchIdx, totalInRound) {
        const heading = isTournament
          ? tournamentLabel(m)
          : `Round ${m.round_number}${totalInRound > 1 ? ` · Match ${m.match_number || matchIdx + 1}` : ''}`;
        return `
          <div class="round-card">
            <div class="round-head">
              <strong>${heading}</strong>
              <span class="small muted">
                ${m.sent_at ? 'sent ' + new Date(m.sent_at).toLocaleString() : 'preparing…'}
                ${m.evaluated_at ? '· evaluated ' + new Date(m.evaluated_at).toLocaleTimeString() : ''}
              </span>
            </div>
            <div class="subjects">
              <div>
                <span class="${m.outcome === 'winner_kept' ? 'win' : 'lose'}">A: ${escapeHtml(m.winner_subject)}</span>
                <span class="small muted">— ${pct(m.winner_rate)} (${m.winner_opens ?? '-'}/${m.winner_recipients ?? '-'})</span>
              </div>
              <div>
                <span class="${m.outcome === 'challenger_won' ? 'win' : 'lose'}">B: ${escapeHtml(m.challenger_subject)}</span>
                <span class="small muted">— ${pct(m.challenger_rate)} (${m.challenger_opens ?? '-'}/${m.challenger_recipients ?? '-'})</span>
              </div>
              ${m.outcome ? `<div class="small">${m.outcome === 'challenger_won' ? '🏆 Challenger took the crown.' : '👑 Defending champion held.'}</div>` : ''}
            </div>
          </div>`;
      }

      document.getElementById('rounds').innerHTML = rounds.length
        ? roundNumbers.map(rn => {
            const matches = byRound.get(rn);
            return matches.map((m, i) => renderMatch(m, i, matches.length)).join('');
          }).join('')
        : '<p class="muted small">No rounds yet — the first send is on its way.</p>';
    }

    document.getElementById('pause_btn').addEventListener('click', async () => {
      await fetch(`/api/campaigns/${id}/pause`, { method: 'POST' });
      refresh();
    });
    document.getElementById('resume_btn').addEventListener('click', async () => {
      await fetch(`/api/campaigns/${id}/resume`, { method: 'POST' });
      refresh();
    });
    document.getElementById('retry_btn').addEventListener('click', async () => {
      if (!confirm('Retry from where it failed?\n\nAny partially-created round (no broadcasts sent) will be discarded so we can re-run cleanly.')) return;
      const r = await fetch(`/api/campaigns/${id}/retry`, { method: 'POST' });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        alert(`Retry failed: ${data.error || r.statusText}`);
      }
      refresh();
    });
    refresh();
    timer = setInterval(refresh, 5000);
  </script>
</body>
</html>
